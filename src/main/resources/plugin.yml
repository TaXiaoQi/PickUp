name: PickUp
version: ${version}
main: pickup.Main
api-version: 1.14
author: 小奇
description: 自定义拾取插件
folia-supported: true

commands:
  up:
    description: 管理拾取插件
    usage: |
      /<command> reload - 重载配置
      /<command> false - 关闭插件拾取（恢复原版）
      /<command> true - 开启插件拾取（禁止原版）
      /<command> status - 查看插件状态
      /<command> set <key> <value> - 动态设置配置项
      /<command> get <key> - 获取配置值
      /<command> list - 列出所有配置项
      /<command> save - 立即保存配置
      /<command> help - 显示帮助信息
    aliases: [Pickup, pickup]
    permission: pickup.admin
    permission-message: §c你没有权限使用此命令！
  mc:
    description: 服务器管理命令（含重启）
    usage: /<command> restart
    permission: pickup.admin
    permission-message: §c你没有权限使用此命令！

# 子命令注册，增强Tab补全
command-nodes:
  up:
    children:
      reload: true
      true: true
      false: true
      status: true
      set: {}
      get: {}
      list: true
      save: true
      help: true

permissions:
  pickup.admin:
    description: 允许管理拾取插件
    default: op